[project]
name = "orchestrator"
version = "0.1.0"
description = "Agent Orchestrator: unattended multi-session Claude/Codex pipeline runner"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.175",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real Agent SDK calls (opt-in, costs money)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
