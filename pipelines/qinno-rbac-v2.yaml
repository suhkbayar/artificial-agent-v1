      - apps/merchant/src/components/molecules/pos/ReturnOrderItemModal.tsx
      - apps/merchant/src/components/molecules/pos/CancelOrderModal.tsx
      - apps/merchant/src/components/molecules/pos/TerminalRefundModal.tsx
      - apps/merchant/src/components/organisms/pos/PosOrderDetailModal.tsx
      - apps/merchant/src/components/organisms/financeOrders/CardRefundAction.tsx
      - apps/merchant/src/hooks/useOrder.ts
      - apps/merchant/src/pages/private/pos/index.tsx
      - "apps/merchant/src/pages/private/pos/[orderId].tsx"
      - apps/merchant/src/locales/*/translation.json
    tests:
      - yarn workspace @qinno/common type-check
      - yarn workspace @qinno/core test
      - yarn workspace @qinno/core type-check
      - yarn workspace @qinno/merchant-service test
      - npx tsc --noEmit -p services/merchant-service
      - yarn workspace @qinno/merchant test
      - yarn workspace @qinno/merchant check-types
      - yarn workspace @qinno/customer-service test
      - |-
        for f in apps/merchant/src/locales/*/translation.json; do
          jq -e '.posLock.title and .approval.title' "$f" >/dev/null || { echo "MISSING $f"; exit 1; }
        done
    # s4-claude-manager-approval.md: requestManagerApproval op maps via the S2 sync step;
    # develop2 seed:merchant x2 (2nd run 0/0).
    post_steps:
      - seed_merchant_develop2
      - seed_merchant_develop2
    memory_entities: ["Decision: RBAC v2"]

  - id: S5
    claude_task: s5-claude-custom-roles.md
    codex_task: s5-codex-roles-staff-ui.md
    handoff: handoff-s5.md
    depends_on: [S4]
    codex_allowlist:
      - services/merchant-service/src/resolvers/private.ts
      - apps/merchant/src/graphql/query/role.ts
      - apps/merchant/src/graphql/mutation/role.ts
      - apps/merchant/src/graphql/query/my-merchant.ts
      - apps/merchant/src/graphql/mutation/my-merchant.ts
      - apps/merchant/src/graphql/query/index.ts
      - apps/merchant/src/graphql/mutation/index.ts
