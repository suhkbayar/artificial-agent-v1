      - apps/merchant/src/types/staff/**
      - apps/merchant/src/hooks/role/**
      - apps/merchant/src/hooks/staff/useStaffNewForm.ts
      - apps/merchant/src/hooks/staff/useStaffEditForm.ts
      - apps/merchant/src/utils/role-matrix.ts
      - apps/merchant/src/utils/role-matrix.test.ts
      - apps/merchant/src/pages/private/roles/**
      - apps/merchant/src/pages/private/staff/new.tsx
      - apps/merchant/src/pages/private/staff/edit.tsx
      - apps/merchant/src/pages/private/router.tsx
      - apps/merchant/src/constants/routePaths.ts
      - apps/merchant/src/components/organisms/MerchantSwitcher.tsx
      - apps/merchant/src/components/organisms/index.ts
      - apps/merchant/src/components/templates/DashboardLayout.tsx
