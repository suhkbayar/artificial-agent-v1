# qinno RBAC v2 — S1..S6 (6 sessions, Claude + Codex tracks).
# Source: ~/Documents/Projects/qinno/docs/planning/rbac-v2/ (README + s1..s6-{claude,codex}-*.md),
# read-only. Schema: docs/planning/orchestrator-v1/README.md §2.
#
# Conventions in this file:
#  - `tests` are the "Verification" commands of BOTH the Claude and the Codex task file, minus
#    `prettier --write` (a formatter, not a check) and the develop2 seed commands (post_steps).
#    The task files pipe every command through `2>&1 | tail -N`, which hides the exit code; the
#    pipes are dropped here because the gate needs the real exit code (the runner captures output).
#    Shell loops end with `|| exit 1` for the same reason (the task files only `echo`).
#  - Codex allowlists are the "File allowlist" blocks of the codex task files, minus the
#    "(new)" annotations.
#  - `TODO ...` marks a value the task files do not state; none are guessed.
#  - `schema_allowlist` (per session) = the `packages/db/**` files in that session's Claude
#    "Ownership" block. Without it the policy hard-stops (BLOCKED) on ANY schema edit. Only S1 owns
#    schema files (s1-claude-foundation.md "Ownership"); S2-S6 own none, so an edit there still
#    hard-stops. Policy can only be tightened here (`policy:` keys = deny-list additions).

name: qinno-rbac-v2
repo: ~/Documents/Projects/qinno
plan_dir: docs/planning/rbac-v2

# Plan README line 186 and s6-claude-qa-release.md line 201 say "signing/updater: do not touch" but
# no plan file names a path. Looked up in qinno (read-only, S6 session): the only signing/updater
# code is the Tauri print agent - apps/agent/app/src-tauri/tauri.conf.json (plugins.updater) and
# .github/workflows/build-agent.yml (TAURI_SIGNING_PRIVATE_KEY). Both are already covered by the
# built-in forbidden globs `apps/agent/**` and `.github/**`, so no `policy.forbidden_write_globs`
# are added: the broad net (plus **/updater/**, **/*signing*/**, *.keystore, *.p12, *.pem) stays.
open_items: []

# O12 (readme.md §2) default is $2/call, $10/session; raised for this pipeline after S5 phase 3
# hit the $2 per-call cap (run 5, 2026-11-03). $100 total unchanged.
budget_usd: { per_call: 4, per_session: 15, total: 100 }

sessions:
  - id: S1
    claude_task: s1-claude-foundation.md
    codex_task: s1-codex-role-keys.md
    handoff: handoff-s1.md
    depends_on: []
    codex_allowlist:
      - packages/common/src/enums/permission/role-key.ts
      - packages/common/src/enums/permission/index.ts
      - services/merchant-service/src/services/user-service.ts
      - services/merchant-service/src/services/device-service.ts
      - services/merchant-service/src/services/authentication-service.ts
      - services/merchant-service/src/services/registration-service.ts
      - packages/core/src/services/guest-service.ts
      - packages/core/src/repositories/manager-user-repository.ts
      - packages/common/src/types/user/manager-users.ts
      - apps/manager/src/utils/permissions.ts
      - apps/manager/src/hooks/use-access.ts
      - apps/manager/src/stores/auth.ts
      - apps/manager/src/graphql/queries/manager-user.ts
    tests:
      - yarn workspace @qinno/common type-check
      - yarn workspace @qinno/core test
      - yarn workspace @qinno/core type-check
      - yarn workspace @qinno/merchant-service test
      - npx tsc --noEmit -p services/merchant-service
      - yarn workspace @qinno/manager-service test
      - yarn workspace @qinno/finance-service test
      - yarn workspace @qinno/finix-service test
      - yarn workspace @qinno/customer-service test
      - yarn workspace @qinno/manager test
      - npx tsc --noEmit -p apps/manager
    # s1-claude-foundation.md T1 (migrate = sync-secrets + drizzle-kit push; must print
    # "Syncing secrets for stage: develop2") and T2 (roles.key seeds; the full `seed` never).
    post_steps:
      - drizzle_push_develop2
      - seed_manager_develop2
      - seed_finance_develop2
      - seed_customer_develop2
      - seed_merchant_develop2
    memory_entities: ["Decision: RBAC v2"]
    # s1-claude-foundation.md "Ownership": roles.key, users (pin), merchant-users (allBranches)
    schema_allowlist:
      - packages/db/src/schemas/core/roles.ts
      - packages/db/src/schemas/core/users.ts
      - packages/db/src/schemas/core/merchant-users.ts

  - id: S2
    claude_task: s2-claude-permissions-seed.md
    codex_task: s2-codex-merchant-gating.md
    handoff: handoff-s2.md
    depends_on: [S1]
    codex_allowlist:
      - services/merchant-service/src/services/route-service.ts
      - services/merchant-service/src/services/index.ts
      - services/merchant-service/src/resolvers/private.ts
      - apps/merchant/src/graphql/query/route.ts
      - apps/merchant/src/graphql/query/index.ts
      - apps/merchant/src/hooks/permission/useMyPermissions.ts
      - apps/merchant/src/hooks/permission/useMyRoutes.ts
      - apps/merchant/src/utils/permissions.ts
      - apps/merchant/src/utils/permissions.test.ts
      - apps/merchant/src/components/atoms/PermissionGate.tsx
      - apps/merchant/src/components/atoms/index.ts
      - apps/merchant/src/components/organisms/AppSidebar.tsx
      - apps/merchant/src/utils/auth.ts
      - apps/merchant/src/locales/*/translation.json
    tests:
      - yarn workspace @qinno/core test
      - yarn workspace @qinno/core type-check
      - yarn workspace @qinno/merchant-service test
      - npx tsc --noEmit -p services/merchant-service
      - yarn workspace @qinno/merchant test
      - yarn workspace @qinno/merchant check-types
      - yarn workspace @qinno/customer-service test
      - |-
        for f in apps/merchant/src/locales/*/translation.json; do
          jq -e '.permission.noAccessTitle' "$f" >/dev/null || { echo "MISSING $f"; exit 1; }
        done
    # s2-claude-permissions-seed.md Verification also names `npx tsc --noEmit -p
    # services/migrate-service`. It was red before RBAC v2 and its `| tail -20` hid the exit code,
    # so it is not gated (checked 2026-11-02 on d17deb40: the 289 errors stay at 290 when only the
    # pre-existing backfills/stock-journal.ts is type-checked, without seeds/merchant.ts).
    known_red:
      - command: npx tsc --noEmit -p services/migrate-service
        reason: >-
          Red before RBAC v2: 289 errors, all in packages/core and packages/common (TS1479 ESM
          sst/graphql-request/uuid under migrate-service's module node16, drizzle SQL type
          mismatches), pulled in by the pre-existing backfills' `@qinno/core/services` and
          `@qinno/core/repositories` imports. Type-checking only backfills/stock-journal.ts, without
          seeds/merchant.ts, gives the same errors, so the seed's `await import('@qinno/core/services')`
          is not the cause. Seeds run via tsx, which does not type-check.
    # s2-claude-permissions-seed.md: seed:merchant on develop2, run twice (2nd run must be 0/0).
    post_steps:
      - seed_merchant_develop2
      - seed_merchant_develop2
    memory_entities: ["Decision: RBAC v2"]

  - id: S3
    claude_task: s3-claude-pin-sessions.md
    codex_task: s3-codex-pin-sessions-ui.md
    handoff: handoff-s3.md
    depends_on: [S2]
    codex_allowlist:
      - apps/merchant/src/pages/private/staff/edit.tsx
      - apps/merchant/src/hooks/staff/useStaffEditForm.ts
      - apps/merchant/src/pages/private/kitchen/settings.tsx
      - apps/merchant/src/hooks/kitchen/useKitchenDeviceListPage.ts
      - apps/merchant/src/graphql/mutation/kitchen.ts
      - apps/merchant/src/graphql/query/kitchen-device.ts
      - apps/merchant/src/types/kitchen/kitchenDevice.types.ts
      - apps/merchant/src/graphql/query/session.ts
      - apps/merchant/src/graphql/mutation/session.ts
      - apps/merchant/src/graphql/query/index.ts
      - apps/merchant/src/graphql/mutation/index.ts
      - apps/merchant/src/hooks/session/useMySessions.ts
      - apps/merchant/src/utils/session.ts
      - apps/merchant/src/utils/session.test.ts
      - apps/merchant/src/utils/device-id.ts
      - apps/merchant/src/pages/private/setting/sessions.tsx
      - apps/merchant/src/pages/private/setting/index.tsx
      - apps/merchant/src/constants/routePaths.ts
      - apps/merchant/src/pages/private/router.tsx
      - apps/merchant/src/graphql/mutation/login.ts
      - apps/merchant/src/pages/public/login/index.tsx
      - apps/merchant/src/types/auth/auth.types.ts
      - apps/merchant/src/locales/*/translation.json
    tests:
      - yarn workspace @qinno/common type-check
      - yarn workspace @qinno/core test
      - yarn workspace @qinno/core type-check
      - yarn workspace @qinno/merchant-service test
      - npx tsc --noEmit -p services/merchant-service
      - yarn workspace @qinno/merchant test
      - yarn workspace @qinno/merchant check-types
      - yarn workspace @qinno/customer-service test
      - |-
        for f in apps/merchant/src/locales/*/translation.json; do
          jq -e '.sessions.title and .staff.pinDuplicate and .kitchen.deviceTypePos' "$f" >/dev/null \
            || { echo "MISSING $f"; exit 1; }
        done
    post_steps: []
    memory_entities: ["Decision: RBAC v2"]

  - id: S4
    claude_task: s4-claude-manager-approval.md
    codex_task: s4-codex-pos-lock-approval.md
    handoff: handoff-s4.md
    depends_on: [S3]
    codex_allowlist:
      - apps/merchant/src/config/apollo-client.ts
      - apps/merchant/src/utils/auth-override-link.ts
      - apps/merchant/src/utils/auth-override-link.test.ts
      - apps/merchant/src/utils/pos-device.ts
      - apps/merchant/src/utils/pos-device.test.ts
      - apps/merchant/src/utils/approval.ts
      - apps/merchant/src/utils/approval.test.ts
      - apps/merchant/src/graphql/mutation/approval.ts
      - apps/merchant/src/graphql/mutation/device-auth.ts
      - apps/merchant/src/graphql/mutation/index.ts
      - apps/merchant/src/hooks/pos/usePosLock.ts
      - apps/merchant/src/hooks/pos/useManagerApproval.ts
      - apps/merchant/src/components/organisms/pos/PosLockOverlay.tsx
      - apps/merchant/src/components/organisms/pos/index.ts
      - apps/merchant/src/components/molecules/pos/ApprovalPinModal.tsx
      - apps/merchant/src/components/molecules/pos/PosDeviceActivationModal.tsx
