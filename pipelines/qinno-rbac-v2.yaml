    # The codex file's `grep -n "ROUTE_PATHS.ROLES" ...  # no PLACEHOLDER_ROUTES entry left` is a
    # manual check whose pass condition is not an exit code; it is omitted rather than guessed.
    tests:
      - yarn workspace @qinno/common type-check
      - yarn workspace @qinno/core test
      - yarn workspace @qinno/core type-check
      - yarn workspace @qinno/merchant-service test
      - npx tsc --noEmit -p services/merchant-service
      - yarn workspace @qinno/merchant test
      - yarn workspace @qinno/merchant check-types
      - yarn workspace @qinno/finance-service test
      - yarn workspace @qinno/customer-service test
      - |-
        for f in apps/merchant/src/locales/*/translation.json; do
          jq -e '.roles.title and .staff.allBranches and .merchantSwitcher' "$f" >/dev/null \
            || { echo "MISSING $f"; exit 1; }
        done
    post_steps: []
    memory_entities: ["Decision: RBAC v2"]

  - id: S6
    claude_task: s6-claude-qa-release.md
    codex_task: s6-codex-review-tests.md
    # The rbac-v2 README lists no handoff for S6 (s6-claude-qa-release.md: the report goes to the
    # user, plus qa-matrix.md and the release runbook). The gate reads the file the VERIFY step
    # writes (gates.read_status), so it is named like S1-S5: handoff-s6.md, written by ⑤.
    handoff: handoff-s6.md
    depends_on: [S5]
    # Part A (review) is read-only; Part B may create only these four new test files.
    codex_allowlist:
      - services/merchant-service/src/__tests__/authz-matrix.fixture.ts
      - services/merchant-service/src/__tests__/authz-matrix.integration.test.ts
      - services/customer-service/src/services/__tests__/authz-qr-menu.test.ts
      - services/finix-service/src/services/__tests__/authz-matrix.test.ts
    tests:
      - yarn workspace @qinno/common type-check
      - yarn workspace @qinno/core test
      - yarn workspace @qinno/core type-check
      - |-
        for s in merchant-service manager-service finance-service finix-service customer-service; do
          yarn workspace @qinno/$s test || exit 1
          npx tsc --noEmit -p services/$s || exit 1
        done
      - yarn workspace @qinno/merchant test
      - yarn workspace @qinno/merchant check-types
      - yarn workspace @qinno/manager test
      - npx tsc --noEmit -p apps/manager
      - npx tsc --noEmit -p apps/qr-menu
      - |-
        for f in apps/merchant/src/locales/*/translation.json; do
          jq empty "$f" || { echo "BAD $f"; exit 1; }
        done
    # Production migrate/seed/deploy are user-only (O8); the Claude track only writes a runbook.
    post_steps: []
    memory_entities: ["Decision: RBAC v2"]
